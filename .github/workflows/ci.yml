name: CI

on:
  push:
    branches: [ main, "copilot/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run pytest (30+ tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libgl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            torch==2.3.0 torchvision==0.18.0 --index-url https://download.pytorch.org/whl/cpu
          pip install \
            sacrebleu rouge-score nltk bert-score \
            pyyaml python-dotenv numpy scipy \
            opencv-python-headless pyscenedetect \
            langgraph langchain langchain-openai \
            transformers \
            pytest

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('wordnet', quiet=True); nltk.download('omw-1.4', quiet=True)"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
